# ==============================================================================
# Formatting contract — Scala 3 indentation syntax.
# Formatting is not taste here: it is a mechanical, non-negotiable normal form,
# so that every diff in a repository shows a change in *meaning*, never a
# change in whitespace.
# ==============================================================================

version    = "3.11.5"
runner.dialect = scala3
maxColumn  = 100

# --- Scala 3 syntax migration -------------------------------------------------

# `if (x) then` -> `if x then`, `x match { ... }` control syntax, vararg splices,
# procedure syntax removal, etc.
rewrite.scala3.convertToNewSyntax = true

# Drop optional braces wherever the indentation syntax can carry the block:
# templates, method bodies, control structures, `given` and `extension` blocks.
#
# NOTE: this deliberately does NOT touch argument-position blocks. The
# `fewerBraces` sub-setting defaults to `never`, so combinator closures keep
# their braces:
#
#     xs.map { x =>          // stays
#       ...
#     }
#
# Rationale: in a chain like `xs.filter { ... }.map { ... }.foldLeft(z) { ... }`
# the braces are the visual delimiters of each stage. Removing them makes the
# chain's arity ambiguous at a glance.
rewrite.scala3.removeOptionalBraces = yes

# An `end` marker is noise on a short block and a navigation aid on a long one.
rewrite.scala3.insertEndMarkerMinLines = 25

rewrite.rules = [RedundantParens, SortModifiers]
rewrite.sortModifiers.preset = styleGuide

# --- Indentation --------------------------------------------------------------

indent.main        = 2
indent.significant = 2
indent.callSite    = 2
indent.defnSite    = 4

# --- Layout -------------------------------------------------------------------

# Vertical alignment produces diffs on untouched lines. Forbidden.
align.preset      = none
align.stripMargin = true

newlines.beforeCurlyLambdaParams = never
newlines.afterCurlyLambdaParams  = preserve

docstrings.style = SpaceAsterisk
docstrings.wrap  = no

trailingCommas = never

project.excludePaths = ["glob:**/target/**"]
