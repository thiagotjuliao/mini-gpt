version = "3.9.4"
runner.dialect = scala3

maxColumn = 100

indent.main = 2
indent.defnSite = 4

align.preset = none
align.stripMargin = true

# Scaladoc deste projeto e prosa em portugues quebrada a mao, com ponteiros
# pra theory/*.md -- reflow automatico embaralharia esse texto.
docstrings.style = SpaceAsterisk
docstrings.wrap = no

# RedundantBraces ficou de fora de proposito: ha chaves com intencao no
# codigo (ex.: `{ for {...} yield ... }.toArray` em Embedding.embed).
rewrite.rules = [RedundantParens, SortModifiers]
